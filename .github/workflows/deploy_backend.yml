name: Deploy Backend to Render

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'services/dashboard/api/**'
      - 'execution/**'
      - 'config/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered on Render."
