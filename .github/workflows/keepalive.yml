name: Keepalive (prevent scheduled-workflow auto-disable)

# GitHub disables scheduled (cron) workflows after 60 days with no repository
# activity. "Process Inbox (Every 2 Hours)" was disabled this way on ~2026-08-25.
# This job pushes one empty commit per week so the 60-day timer never expires,
# keeping the inbox processor running in the cloud regardless of local activity.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
