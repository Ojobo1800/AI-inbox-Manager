services:
  - type: web
    name: inboxgenius-api
    runtime: python
    rootDir: services/dashboard/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STAKEHOLDER_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-inbox-manager-vert.vercel.app
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
