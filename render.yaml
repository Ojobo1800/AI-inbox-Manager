services:
  - type: web
    name: inboxgenius-api
    runtime: python
    rootDir: services/dashboard/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inboxgenius-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STAKEHOLDER_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: inboxgenius-db
    databaseName: inboxgenius
    plan: free
