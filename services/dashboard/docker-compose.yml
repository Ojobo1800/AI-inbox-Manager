version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: email_dashboard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend (development)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: email_dashboard_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/email_dashboard
      ENVIRONMENT: development
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - ./api:/app
      - ../../execution:/app/execution  # Mount execution scripts
      - ../../.env:/app/.env  # Mount existing .env file
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
